instructions: |
  **白胖左侧网格交易策略（完全来自手册原文）**
  核心逻辑：针对基本面低估、未来价值确定的标的，在股价低于合理价值区间时，通过网格交易分批建仓，持续降低持仓成本，同时配套严格的仓位控制，规避单边下跌风险，最终实现左侧转右侧的趋势交易。

  一、左侧标的筛选规则（手册原文）
  1. **基本面估值要求**
     - 业绩平稳可预期的行业（银行、保险、家电、白酒等）：PE处于近十年历史最低值平均水平，为低估状态；
     - 周期行业（有色、石油、化工、半导体硬件等）：PB处于近十年历史最低值平均水平，为低估状态；
     - 行业景气度向上，未来基本面具备明确增长逻辑，优先选择行业龙头/细分赛道龙头标的。
  2. **标的排除规则（手册原文）**
     - 互联网、游戏、软件等轻资产行业，无法通过PE/PB稳定估值，不适用左侧网格策略；
     - 行业景气度持续下行，基本面持续恶化的标的，排除；
     - 流通市值低于80亿的小盘股，不适用左侧网格策略。

  二、网格仓位设计规则（手册原文）
  1. **总仓位限制**
     - 单一标的的左侧网格总资金，不超过总仓位的3成，常规设置为2成；
     - 普通投资者左侧总仓位，不超过总资金的5成，避免右侧信号出现时无可用资金。
  2. **网格分仓规则**
     - 单一标的网格总资金分为10等份，首笔建仓5份，剩余5份为下跌网格加仓资金；
     - 网格幅度设置：常规行情每下跌4%，加仓1份；极端单边下跌行情，可拉大网格幅度至10%，加快降成本速度。
  3. **网格卖出规则**
     - 股价上涨，每上涨2格网格幅度，卖出1份，直至卖出中线之上2格后，剩余3份仓位停止卖出，转为右侧交易，避免单边上涨行情卖飞。

  三、左侧转右侧交易规则（手册原文）
  1. **基础转右规则**
     - 左侧网格交易，在卖出中线之上2格之后，剩余3份仓位不再卖出，直接转为右侧交易，执行分仓止盈策略。
  2. **进阶转右规则**
     - 个股技术面给出结束盘整/下跌的信号（带量突破回调波段50%、完成完整底部形态），即可提前转为右侧交易，启动浮盈加仓与分仓止盈规则。
  3. **左转右整体止盈规则**
     - 右侧新加仓部分浮盈超过40%以上，将左右侧仓位作为一个整体，执行分仓止盈策略；
     - 后续股价跌回右侧起点后，停止右侧交易，继续执行左侧网格策略。

  四、风险控制规则（手册原文）
  1. 标的基本面恶化，低估逻辑被证伪，立即停止左侧网格，止损离场；
  2. 个股进入明确下跌趋势，且无基本面支撑，立即停止左侧加仓，规避单边下跌风险；
  3. 右侧交易信号明确时，可降低左侧仓位，腾出资金执行右侧交易。

  评分调整：
  - 标的处于近十年历史估值低位，基本面稳定，行业景气度向上：sentiment_score +10
  - 标的基本价值线明确，现价低于基本价值线，具备足够安全边际：sentiment_score +8
  - 标的基本面恶化，估值逻辑被证伪，处于明确下跌趋势：sentiment_score -10
  - 在 `buy_reason` 和 `pattern_analysis` 中必须注明"左侧网格交易"，并标注标的估值逻辑与网格参数。